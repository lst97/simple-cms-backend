version: '3.8'
services:
    simple-cms-backend:
        image: lst97/simple-cms-backend:dev
        ports:
            - '1168:1168'
        depends_on:
            - mongo
        volumes:
            - ~/app:/app:ro
        networks:
            - app_network

    mongo:
        image: arm64v8/mongo:4.4.18
        ports:
            - '27017:27017'
        expose:
            - '27017'
        volumes:
            - mongodb_data:/data/db
        networks:
            - app_network

networks:
    app_network:

volumes:
    mongodb_data:
