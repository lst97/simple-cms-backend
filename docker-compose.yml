version: '3.8'
services:
    app:
        build: .
        ports:
            - '1168:1168'
        depends_on:
            - mongo
        environment:
            - MONGODB_URI=mongodb://mongo:27017/simple-cms
        volumes:
            - ~/app:/app:ro

    mongo:
        image: mongo:latest
        ports:
            - '27017:27017'
        volumes:
            - mongodb_data:/data/db

volumes:
    mongodb_data:
