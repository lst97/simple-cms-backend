version: '3.8'
services:
    simple-cms-backend:
        image: lst97/simple-cms-backend:dev
        ports:
            - '1168:1168'
        depends_on:
            - mongo
        environment:
            - BCRYPT_SALT_ROUNDS=${BCRYPT_SALT_ROUNDS}
            - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}
        volumes:
            - ~/app:/app:ro

    mongo:
        image: arm64v8/mongo:4.4.18
        ports:
            - '27017:27017'
        volumes:
            - mongodb_data:/data/db

volumes:
    mongodb_data:
