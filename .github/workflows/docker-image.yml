name: CI/CD

on:
    push:
        branches: [dev]

jobs:
    build-and-deploy:
        runs-on: self-hosted

        steps:
            - uses: actions/checkout@v4

            - name: Build and push Docker images
              env:
                  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
                  DOCKER_HUB_ACCESS_TOKEN:
                      ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
                  ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
                  BCRYPT_SALT_ROUNDS: ${{ secrets.BCRYPT_SALT_ROUNDS }}
              run: |
                  echo $DOCKER_HUB_ACCESS_TOKEN | docker login -u $DOCKER_HUB_USERNAME --password-stdin
                  docker build -t $DOCKER_HUB_USERNAME/simple-cms-backend:dev .
                  docker push $DOCKER_HUB_USERNAME/simple-cms-backend:dev

            - name: Copy docker-compose.yml and Dockerfile to server
              uses: appleboy/scp-action@master
              with:
                  host: ${{ secrets.SERVER_HOST }}
                  username: ${{ secrets.SERVER_USERNAME }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  source: docker-compose.yml, Dockerfile
                  target: ~/app

            - name: Deploy to server
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ secrets.SERVER_HOST }}
                  username: ${{ secrets.SERVER_USERNAME }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  script: |
                      cd ~/app
                      echo "BCRYPT_SALT_ROUNDS=${{ secrets.BCRYPT_SALT_ROUNDS }}" > .env
                      echo "ACCESS_TOKEN_SECRET=${{ secrets.ACCESS_TOKEN_SECRET }}" >> .env
                      docker-compose pull
                      docker-compose down
                      docker-compose up -d
                      docker cp ./.env app-simple-cms-backend-1:/usr/src/app
                      docker run -d --link mongo:mongo simple-cms-backend
