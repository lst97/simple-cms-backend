name: CI/CD

on:
    push:
        branches: [dev]

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set DNS Server
              run: echo "nameserver 1.1.1.1" | sudo tee -a /etc/resolv.conf

            - name: Build and push Docker images
              env:
                  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
                  DOCKER_HUB_ACCESS_TOKEN:
                      ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
              run: |
                  echo $DOCKER_HUB_ACCESS_TOKEN | docker login -u $DOCKER_HUB_USERNAME --password-stdin
                  docker build -t $DOCKER_HUB_USERNAME/simple-cms-backend:dev .
                  docker push $DOCKER_HUB_USERNAME/simple-cms-backend:dev

            - name: Deploy to server
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ secrets.SERVER_HOST }}
                  username: ${{ secrets.SERVER_USERNAME }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  script: |
                      cd ~/app
                      docker-compose pull  # Ensure images are up to date
                      docker-compose down  # Stop current containers (optional, but good practice)
                      docker-compose up -d  # Start containers with mounted volume
